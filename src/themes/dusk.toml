# dusk: a full-width framed panel with a continuous violet-to-amber gradient
# running through the border. Collapses to a single line in narrow terminals.
description = "Framed panel with a continuous gradient border. Collapses when narrow."

[palette]
text   = "#ece7f5"
muted  = "#9d93b5"
faint  = "#4a4361"
accent = "#d7b9ff"
violet = "#8a7bff"
rose   = "#e66f9c"
amber  = "#f6b26b"
ok     = "#8fd9c0"
warn   = "#f6b26b"
hot    = "#ff5f7e"
add    = "#8fd9c0"
del    = "#ff8fa3"

[settings]
bar = "dusk"
sep = "  "

[style]
border = "beam:violet,rose,amber"
model = "text bold"

[bars.dusk]
fill = "█"
empty = "█"
track = true
partial = ["▏", "▎", "▍", "▌", "▋", "▊", "▉"]
color = "ramp"
ramp = ["violet", "rose", "amber"]
empty_style = "faint"

[module.title]
format = "<text bold>{dir.name}</>{if git.branch} <muted>on</> <accent>{git.branch | trunc:26}</>{if git.dirty}<amber>{g.dirty}</>{end}{end}"
compact = "<text bold>{dir.name}</>"
priority = 90
[module.ident]
format = "<text>{model.name}</>{if effort.level} <muted>{effort.level}</>{end}"
compact = "<text>{model.short}</>"
priority = 85
[module.ctx]
format = "<muted>ctx</> {ctx.pct | bar:12} <=severity(ctx.pct)>{ctx.pct | round}%</>"
compact = "<muted>ctx</> <=severity(ctx.pct)>{ctx.pct | round}%</>"
style = "text"
[module.h5]
format = "<muted>5h</> {limit.h5.pct | bar:6} <=severity(limit.h5.pct)>{limit.h5.pct | round}%</>{if limit.h5.left} <muted>{limit.h5.left | dur:1}</>{end}"
compact = "<muted>5h</> <=severity(limit.h5.pct)>{limit.h5.pct | round}%</>"
style = "text"
[module.d7]
format = "<muted>7d</> {limit.d7.pct | bar:6} <=severity(limit.d7.pct)>{limit.d7.pct | round}%</>"
compact = "<muted>7d</> <=severity(limit.d7.pct)>{limit.d7.pct | round}%</>"
style = "text"
[module.cost]
format = "{cost.usd | money}"
style = "accent"
[module.foot_cache]
if = "cache.observed"
format = "cache {cache.hit | round}%{if cache.warm && cache.left} · {cache.left | clock}{end}{if !cache.warm} · cold{end}"
compact = "cache {cache.hit | round}%"
style = "muted"
priority = 30
[module.foot_lines]
if = "cost.lines"
format = "<add>+{cost.added}</> <del>-{cost.removed}</>"
priority = 25
[module.foot_time]
if = "cost.duration"
format = "{cost.duration | dur}"
style = "muted"
priority = 20

[[line]]
prefix = "<border>╭─ </>"
suffix = "<border> ─╮</>"
fill = "─"
fill_style = "border"
sep = "  "
left = ["title"]
right = ["ident"]

[[line]]
prefix = "<border>│ </>"
suffix = "<border> │</>"
full = true
keep = true
sep = "   "
left = ["ctx", "h5", "d7"]

[[line]]
prefix = "<border>╰─ </>"
suffix = "<border> ─╯</>"
fill = "─"
fill_style = "border"
keep = true
sep = "<muted> · </>"
full = true
left = ["tool"]
right = ["foot_lines", "foot_cache", "foot_time"]

[[when]]
name = "collapse when narrow"
if = "term.cols < 72"
[[when.line]]
sep = "  "
left = ["model", "dir"]
right = ["ctx", "h5"]
