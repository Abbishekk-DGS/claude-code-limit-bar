# matrix: phosphor green on black, written like a shell.
extends = "indigo"
description = "Phosphor green on black, written like a shell."

[palette]
panel  = "#000a02"
text   = "#c8ffc8"
accent = "#00ff41"
muted  = "#3fa650"
track  = "#0f3318"
ok     = "#00ff41"
warn   = "#d7ff00"
hot    = "#ff3b3b"
dark   = "#001a06"

[bars.meter]
dither = 0.22
cap_style = "muted"
label_fill = "dark"
label_track = "text"

[glyphs]
alarm = { unicode = "t-", ascii = "t-" }
into  = { unicode = "❯", ascii = ">" }
gear  = { unicode = "$", ascii = "$" }

[module.place]
format = "<accent>{g.into}</> <bold>{dir.name}</> {if git.repo}<accent>{g.branch} {git.branch ?? git.oid | trunc:28}</>{if git.dirty}<warn>{g.dirty}</>{end}{else}<muted italic>(no git)</>{end}"
compact = "<accent>{g.into}</> <bold>{dir.name}</>"

[module.set_effort]
format = "<accent>{g.gear}</> <muted>effort:</>{effort.level}"

[[line]]
style = "fg:text on:panel"
full = true
prefix = " "
suffix = " "
sep = " <muted>|</> "
left = ["h5", "d7", "model", "cache"]

[[line]]
style = "fg:text on:panel"
full = true
prefix = " "
suffix = " "
sep = " <muted>{g.dot}</> "
left = ["place", "version"]

[[line]]
style = "fg:text on:panel"
full = true
prefix = " "
suffix = " "
sep = " <muted>{g.dot}</> "
left = ["set_effort", "set_think", "set_fast", "set_style"]
