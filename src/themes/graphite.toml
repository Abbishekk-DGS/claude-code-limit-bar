# graphite: one quiet line. Grey until something needs your attention.
description = "One quiet line. Grey until something needs your attention."

[palette]
text   = "#c9d1d9"
muted  = "#7d8590"
faint  = "#3d444d"
accent = "#a5b4c4"
ok     = "#7d8590"
warn   = "#e3b341"
hot    = "#ff6b6b"
add    = "#7d8590"
del    = "#7d8590"

[settings]
bar = "thin"
sep = "  "

[style]
model = "text bold"

[module.git]
format = "{git.branch | trunc:28}{if git.dirty}<warn>{g.dirty}</>{end}"
style = "muted"

[module.ctx]
format = "{ctx.pct | bar:12} <=ctx.pct >= 60 ? severity(ctx.pct) : 'text'>{ctx.pct | round}%</>"
compact = "<=ctx.pct >= 60 ? severity(ctx.pct) : 'text'>{ctx.pct | round}%</>"

[[line]]
left  = ["model", "dir", "git", "lines", "vim", "agent"]
right = ["h5_forecast", "ctx", "h5", "d7", "spend"]
