# neon: the look of the bar. Saturated colours on your terminal's own background, with
# gauges running blue to violet to pink, so the fuller the gauge, the hotter its end.
# The colours are deep enough to read on white and bright enough to read on black.
# Override any of this in config.toml, or with `set` and `color`.
description = "Saturated colours on a transparent background, with gradient gauges running blue to pink."

[palette]
panel  = "#07070d"
text   = "#f2f2ff"
blue   = "#0a84ff"
cyan   = "#0097b2"
violet = "#9b3dff"
pink   = "#e6129f"
lime   = "#17a300"
accent = "#0097b2"
muted  = "#7f7f9c"
faint  = "#7f7f9c"
track  = "#3a3a55"
ok     = "#0097b2"
warn   = "#c77700"
hot    = "#e6129f"
add    = "#17a300"
del    = "#e6129f"
white  = "#ffffff"

[settings]
bar = "meter"
gauge_width = 10
gauge_show = "used"   # used | left
clock = "24h"         # 24h | 12h
sep = " <pink>{g.rule}</> "

# Plain text takes your terminal's own colour, so it reads on any background.
[style]
model = "bold"
text = ""

[bars.meter]
left = "["
right = "]"
label = true
fill = "█"
track = true
color = "ramp"
ramp = ["blue", "violet", "pink"]
cap_style = "pink"
empty_style = "track"
label_fill = "white"
label_track = "white"

[bars.thin]
fill = "━"
empty = "╌"
color = "ramp"
ramp = ["blue", "violet", "pink"]
empty_style = "track"

[bars.ticks]
fill = "▮"
empty = "▯"
color = "ramp"
ramp = ["blue", "violet", "pink"]
empty_style = "track"

[bars.dots]
fill = "●"
empty = "○"
color = "ramp"
ramp = ["blue", "violet", "pink"]
empty_style = "track"

[bars.ascii]
left = "["
right = "]"
label = true
fill = "#"
empty = "-"
empty_style = "muted"

[glyphs]
rule  = { unicode = "┃", ascii = "|" }
alarm = { unicode = "⚡", ascii = "!" }
to    = { unicode = "→", ascii = ">" }
into  = { unicode = "▸", ascii = ">" }
gear  = { unicode = "✦", ascii = "*" }
skill = { unicode = "✧", ascii = "sk" }
mcp   = { unicode = "⌁", ascii = "mcp" }
stash = { unicode = "≡", ascii = "stash" }
tag   = { unicode = "⌑", ascii = "tag" }
turn  = { unicode = "↻", ascii = "turns" }
pack  = { unicode = "⇣", ascii = "compact" }

[var]
h5_color = "severity(limit.h5.projected ?? limit.h5.pct)"
d7_color = "severity(limit.d7.projected ?? limit.d7.pct)"

# How every row looks. Empty means transparent: your terminal's background shows
# through. For a solid black panel use: style = "fg:white on:panel" and full = true.
# The rows themselves are in [layout].
[row]

# A row with nothing to show disappears. A ">" pushes what follows to the right.
[layout]
rows = [
  ["h5", "d7", "ctx", "h5_forecast"],
  ["user", "git", "git_sync", "git_changes", "git_op", "pr", "worktree", "lines", ">", "agent", "vim"],
  ["model", "effort", "think", "fast", "style", "cache", ">", "version"],
  ["tool", "agents", "todo", "skills"],
  ["duration", "turns", "tools", "compactions", "speed", "burn", ">", "clock"],
]
