# Your bar's config. Everything here is optional: delete what you do not need.
# Check it: limit-bar validate  |  See values: limit-bar fields
#
# For quick changes you do not need this file at all:
#   limit-bar customize      live editor with a preview
#   limit-bar show NAME      turn something on (limit-bar modules lists them)
#   limit-bar set KEY VALUE  username, gauge_width, bar, clock and more
#   limit-bar color pink "#ff00aa"

[settings]
# username = "neo"     # what the bar calls you
# charset = "nerd"     # nerd | unicode | ascii. Use nerd if your font has the glyphs
# gauge_width = 10
# gauge_show = "used"  # used | left
# clock = "24h"        # 24h | 12h
# warn = 60            # severity() thresholds used by colours
# hot  = 85

# Recolour anything. Names defined here can be used in any style.
# [palette]
# pink = "#ff00aa"

# Choose what each row shows. A ">" pushes what follows to the right.
# [layout]
# rows = [
#   ["h5", "d7", "ctx"],
#   ["user", "git", "git_changes", ">", "clock"],
# ]

# Change how a built-in module looks.
# [module.ctx]
# format = "context {ctx.pct | round}%"

# Add your own module, from any command. It runs in the background, never inline.
# [source.kube]
# command = "kubectl config current-context"
# every = "30s"
#
# [module.kube]
# if = "source.kube.value"
# format = "k8s {source.kube.value}"
# style = "cyan"

# Then add it to a row with: limit-bar show kube

# React to state. A rule can override anything.
# [[when]]
# name = "alarm when context is nearly full"
# if = "ctx.pct >= 90"
# [when.palette]
# violet = "#ff2bd6"
